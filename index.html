
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Dvlop AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;min-height:420px;display:flex;flex-direction:column;background:#0b1020;color:#f4f6ff;font-family:Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#11182a;border-bottom:1px solid #27324a}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7185ff,#a05cff);font-size:23px;font-weight:bold}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:#9ba8c2;margin-top:4px}
button{cursor:pointer;font:inherit}
#newChat{padding:9px 11px;background:#1a2338;color:white;border:1px solid #35415c;border-radius:10px}
#chat{width:100%;max-width:850px;margin:auto;padding:18px 14px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.welcome{margin:auto 0;text-align:center;padding:20px 8px}
.welcome .star{font-size:46px;color:#9aa8ff}
.welcome h2{font-size:25px;margin:10px 0}
.welcome p{color:#9ba8c2;line-height:1.6}
.message{max-width:90%;padding:12px 14px;border:1px solid #27324a;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.user{align-self:flex-end;background:#3548a8;border-color:#5369d8}
.assistant{align-self:flex-start;background:#151e32}
.label{display:block;font-size:11px;font-weight:bold;color:#b4c0ff;margin-bottom:5px}
.error{background:#301923;border-color:#813c4c;color:#ffc0c0}
.composer-wrap{padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#11182a;border-top:1px solid #27324a}
#composer{display:flex;align-items:flex-end;gap:9px;max-width:820px;margin:auto;padding:8px;border:1px solid #35415c;border-radius:16px;background:#0d1425}
#input{flex:1;width:100%;min-width:0;max-height:130px;resize:none;padding:10px 7px;background:transparent;color:white;border:0;outline:none;font:16px/1.5 Arial,sans-serif}
#input::placeholder{color:#8390aa}
#send{width:44px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:#7185ff;color:white;font-size:24px;font-weight:bold}
#send:disabled{opacity:.5}
.footnote{text-align:center;color:#9ba8c2;font-size:11px;padding-top:9px}
@media(max-width:480px){header{padding:11px 12px}h1{font-size:17px}#newChat{font-size:12px;padding:8px}#chat{padding:15px 11px}.message{max-width:95%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">D</div>
    <div><h1>Dvlop AI</h1><div class="sub">Your AI assistant</div></div>
  </div>
  <button id="newChat" type="button">＋ New chat</button>
</header>

<main id="chat" aria-live="polite">
  <section class="welcome">
    <div class="star">✦</div>
    <h2>Welcome to Dvlop AI</h2>
    <p>Ask questions, learn new things,<br>and explore your ideas.</p>
  </section>
</main>

<div class="composer-wrap">
  <form id="composer">
    <textarea id="input" rows="1" maxlength="6000" placeholder="Message Dvlop AI..." aria-label="Message" required></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
  <div class="footnote">AI can make mistakes. Check important information.</div>
</div>

<script>
"use strict";

const API_URL = "https://dvlop-ai-api.dev358627.workers.dev";
const chat = document.getElementById("chat");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const send = document.getElementById("send");
const newChat = document.getElementById("newChat");

let messages = [];
let busy = false;

function addMessage(text, role, isError = false) {
  const bubble = document.createElement("div");
  bubble.className = "message " + role + (isError ? " error" : "");

  if (role === "assistant") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "Dvlop AI";
    bubble.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  bubble.appendChild(content);
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  return content;
}

function setBusy(value) {
  busy = value;
  send.disabled = value;
  input.disabled = value;
  send.textContent = value ? "…" : "↑";
}

async function sendMessage(event) {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;

  const previous = messages.slice();
  messages.push({role:"user",content:text});
  addMessage(text,"user");
  input.value = "";
  input.style.height = "auto";
  setBusy(true);

  const waiting = addMessage("Soch raha hoon...","assistant");

  try {
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:messages.slice(-20)})
    });

    const raw = await response.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Worker ka response samajh nahi aaya. HTTP "+response.status);
    }

    if (!response.ok) {
      throw new Error(data.error || "Request failed: HTTP "+response.status);
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error(data.error || "AI ka jawab nahi mila.");
    }

    waiting.textContent = data.reply;
    messages.push({role:"assistant",content:data.reply});
  } catch (error) {
    messages = previous;
    waiting.textContent = "Connection error: "+(error.message || "Unknown error")+
      "\n\nCloudflare Worker aur OpenRouter model ki settings check karni hongi.";
    waiting.parentElement.classList.add("error");
  } finally {
    setBusy(false);
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit",sendMessage);

input.addEventListener("input",function(){
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,130)+"px";
});

input.addEventListener("keydown",function(event){
  if(event.key==="Enter" && !event.shiftKey){
    event.preventDefault();
    form.requestSubmit();
  }
});

newChat.addEventListener("click",function(){
  if(busy) return;
  messages=[];
  chat.replaceChildren();

  const welcome=document.createElement("section");
  welcome.className="welcome";
  welcome.innerHTML="<div class='star'>✦</div><h2>What can I help with?</h2><p>Start a new conversation with Dvlop AI.</p>";
  chat.appendChild(welcome);
  input.value="";
  input.focus();
});
</script>
</body>
</html>
